<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - WiFi Capacity Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Layered neutral tones for dark mode */
            --bg-primary: #111111;
            --bg-secondary: #151515;
            --bg-tertiary: #1E1E1E;
            --bg-elevated: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a3a3a3;
            --text-tertiary: #737373;
            --text-label: #e5e5e5;
            --border-color: #2a2a2a;
            --border-hover: #404040;
            --button-border: #333333;
            --button-bg-hover: rgba(255, 255, 255, 0.05);
            --card-hover: rgba(255, 255, 255, 0.03);
            --accent-color: #60a5fa;
            --accent-hover: #3b82f6;
            --accent-glow: rgba(96, 165, 250, 0.2);
            
            /* Shadows for depth */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.6);
            
            /* Consistent border radius */
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 18px;
            --radius-xl: 24px;
            --radius-full: 50px;
            
            /* Spacing Scale */
            --spacing-1: 8px;
            --spacing-2: 12px;
            --spacing-3: 16px;
            --spacing-4: 24px;
            --spacing-5: 32px;
            --spacing-6: 40px;
            --spacing-7: 48px;
            --spacing-8: 64px;
            
            /* Typography Scale */
            --font-title: 32px;
            --font-subtitle: 13px;
            --font-metric-large: 64px;
            --font-metric-medium: 32px;
            --font-label: 13px;
            --font-body: 14px;
            --font-caption: 12px;
            --font-small: 10px;
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #e8e8e8;
            --bg-elevated: #fafafa;
            --text-primary: #111111;
            --text-secondary: #525252;
            --text-tertiary: #737373;
            --text-label: #262626;
            --border-color: #d4d4d4;
            --border-hover: #a3a3a3;
            --button-border: #d4d4d4;
            --button-bg-hover: rgba(0, 0, 0, 0.05);
            --card-hover: rgba(0, 0, 0, 0.03);
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-glow: rgba(37, 99, 235, 0.2);
            
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            background-image: radial-gradient(ellipse at top, var(--bg-secondary) 0%, var(--bg-primary) 50%);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: var(--spacing-4);
        }

        .top-nav {
            position: fixed;
            top: var(--spacing-4);
            right: var(--spacing-4);
            display: flex;
            align-items: center;
            gap: var(--spacing-2);
            z-index: 1000;
        }

        .back-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-full);
            padding: var(--spacing-2) var(--spacing-4);
            cursor: pointer;
            font-size: var(--font-body);
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-1);
        }

        .back-btn:hover {
            border-color: var(--border-hover);
            background: var(--bg-elevated);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .subscribe-btn {
            background: var(--accent-color);
            border: 1px solid var(--accent-color);
            color: white;
            border-radius: var(--radius-full);
            padding: var(--spacing-2) var(--spacing-4);
            cursor: pointer;
            font-size: var(--font-body);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .subscribe-btn:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            box-shadow: 0 4px 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        .theme-toggle {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-full);
            width: var(--spacing-7);
            height: var(--spacing-7);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .theme-toggle:hover {
            border-color: var(--border-hover);
            background: var(--bg-elevated);
            transform: rotate(20deg);
            box-shadow: var(--shadow-md);
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            padding-top: var(--spacing-8);
        }

        .header-section {
            text-align: center;
            margin-bottom: var(--spacing-6);
        }

        h1 {
            font-size: var(--font-title);
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-1);
            letter-spacing: -0.5px;
            transition: color 0.3s ease;
        }

        .subtitle {
            font-size: var(--font-subtitle);
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-5);
            width: 100%;
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-4);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-1);
        }

        .form-label {
            font-size: var(--font-label);
            font-weight: 500;
            color: var(--text-label);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input,
        .form-textarea {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: var(--spacing-2) var(--spacing-3);
            font-size: var(--font-body);
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: var(--text-tertiary);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            background: var(--accent-color);
            border: none;
            border-radius: var(--radius-full);
            padding: var(--spacing-3) var(--spacing-5);
            font-size: var(--font-body);
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: var(--spacing-2);
        }

        .submit-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .contact-info {
            margin-top: var(--spacing-5);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-3);
            padding-top: var(--spacing-4);
            border-top: 1px solid var(--border-color);
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-2);
            color: var(--text-secondary);
            font-size: var(--font-body);
        }

        .info-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .info-link {
            color: var(--accent-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .info-link:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: var(--spacing-5);
        }

        .success-message.show {
            display: block;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: var(--spacing-3);
        }

        .success-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-2);
        }

        .success-text {
            color: var(--text-secondary);
            font-size: var(--font-body);
        }

        /* Powered By Section */
        .powered-by {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-3);
            margin-top: var(--spacing-5);
            padding: var(--spacing-4);
            opacity: 0.8;
        }

        .powered-text {
            font-size: var(--font-body);
            color: var(--text-secondary);
            font-weight: 500;
        }

        .powered-by-link {
            text-decoration: none;
            display: inline-flex;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .powered-by-link:hover {
            transform: translateY(-2px);
        }

        .prime-logo {
            height: 48px;
            width: auto;
            transition: filter 0.3s ease;
        }

        .prime-logo-dark {
            display: block;
        }

        .prime-logo-light {
            display: none;
        }

        [data-theme="light"] .prime-logo-dark {
            display: none;
        }

        [data-theme="light"] .prime-logo-light {
            display: block;
        }

        @media (max-width: 768px) {
            :root {
                --font-title: 28px;
                --font-body: 13px;
            }

            .container {
                padding-top: var(--spacing-7);
            }

            .card {
                padding: var(--spacing-4);
            }
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="pricing.html" class="subscribe-btn">Subscribe Now</a>
        <a href="index.html" class="back-btn">← Back to Calculator</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
            <span id="themeIcon">🌙</span>
        </button>
    </div>
    
    <div class="container">
        <div class="header-section">
            <h1>Contact Us</h1>
            <p class="subtitle">We'd love to hear from you</p>
        </div>

        <div class="card">
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label class="form-label" for="name">Your Name</label>
                    <input type="text" id="name" class="form-input" placeholder="Enter your name" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="subject">Subject</label>
                    <input type="text" id="subject" class="form-input" placeholder="What's this about?">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="message">Message</label>
                    <textarea id="message" class="form-textarea" placeholder="Write your message here..." required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Send Message</button>
            </form>

            <div class="success-message" id="successMessage">
                <div class="success-icon">✅</div>
                <h2 class="success-title">Message Sent!</h2>
                <p class="success-text">Thank you for reaching out. We'll get back to you soon.</p>
            </div>

            <div class="contact-info">
                <div class="info-item">
                    <span class="info-icon">📧</span>
                    <span>Email: <a href="mailto:info@example.com" class="info-link">info@example.com</a></span>
                </div>
                <div class="info-item">
                    <span class="info-icon">🌐</span>
                    <span>Website: <a href="https://cricketnepal.org.np" target="_blank" class="info-link">cricketnepal.org.np</a></span>
                </div>
            </div>
        </div>

        <!-- Powered By Section -->
        <div class="powered-by">
            <span class="powered-text">Powered by</span>
            <a href="https://cricketnepal.org.np/event/nepal-premier-league/" target="_blank" rel="noopener noreferrer" class="powered-by-link">
                <img src="npl logo .png" alt="Nepal Premier League" class="prime-logo prime-logo-dark">
                <img src="npl white.png" alt="Nepal Premier League" class="prime-logo prime-logo-light">
            </a>
        </div>
    </div>

    <script>
        // Theme management
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        // Load saved theme or default to dark
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            html.setAttribute('data-theme', 'light');
            themeIcon.textContent = '☀️';
        } else {
            html.removeAttribute('data-theme');
            themeIcon.textContent = '🌙';
        }

        // Theme toggle handler
        themeToggle.addEventListener('click', function() {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            html.setAttribute('data-theme', newTheme === 'light' ? 'light' : null);
            themeIcon.textContent = newTheme === 'light' ? '☀️' : '🌙';
            localStorage.setItem('theme', newTheme);

            if (newTheme === 'dark') {
                html.removeAttribute('data-theme');
            }
        });

        // Form submission
        const contactForm = document.getElementById('contactForm');
        const successMessage = document.getElementById('successMessage');

        contactForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Hide form and show success message
            contactForm.style.display = 'none';
            successMessage.classList.add('show');
            
            // Reset form after delay
            setTimeout(() => {
                contactForm.reset();
            }, 1000);
        });
    </script>
</body>
</html>
